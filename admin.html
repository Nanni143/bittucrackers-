<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Bittu Crackers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased min-h-screen pb-12">

  <!-- PIN Modal -->
  <div id="login-modal" class="fixed inset-0 bg-gray-900/80 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-xl text-center">
      <h2 class="text-base font-bold text-gray-900">Admin Login</h2>
      <p class="text-xs text-gray-500 mt-1 mb-4">Enter PIN (Default: 1234)</p>
      <input id="admin-pin" type="password" maxlength="6" placeholder="PIN" class="w-full text-center text-lg tracking-widest border rounded-lg p-2 mb-3 outline-none focus:border-red-600" />
      <button onclick="checkPin()" class="w-full bg-red-600 text-white font-semibold py-2 rounded-lg text-xs">Enter Dashboard</button>
      <p id="login-error" class="text-xs text-red-600 mt-2 hidden">Incorrect PIN.</p>
    </div>
  </div>

  <div id="admin-app" class="hidden">
    <header class="bg-neutral-900 text-white px-4 py-3 flex justify-between items-center sticky top-0 z-30">
      <div class="flex items-center space-x-2">
        <span class="bg-red-600 text-white font-black px-2 py-0.5 rounded text-xs">B</span>
        <span class="font-extrabold text-sm tracking-wide">BITTU CRACKERS ADMIN</span>
      </div>
      <a href="index.html" class="text-xs text-gray-400 hover:text-white">Store View →</a>
    </header>

    <div class="bg-white border-b px-4 py-2 flex space-x-2 text-xs font-semibold">
      <button onclick="switchTab('orders')" id="tab-orders" class="px-3 py-1.5 rounded-lg bg-red-600 text-white">Orders</button>
      <button onclick="switchTab('products')" id="tab-products" class="px-3 py-1.5 rounded-lg text-gray-600">Price Sheet & Items</button>
    </div>

    <main class="p-4 max-w-4xl mx-auto space-y-6">

      <!-- Orders Tab -->
      <section id="sec-orders" class="space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-base font-bold text-gray-900">Customer Bookings</h2>
          <button onclick="loadOrders()" class="text-xs bg-gray-200 px-3 py-1 rounded font-semibold">Refresh</button>
        </div>
        <div class="bg-white rounded-xl border overflow-x-auto shadow-sm">
          <table class="w-full text-left text-xs whitespace-nowrap">
            <thead class="bg-gray-50 border-b text-gray-500 font-bold uppercase text-[10px]">
              <tr>
                <th class="p-3">Order</th>
                <th class="p-3">Customer</th>
                <th class="p-3">Amount</th>
                <th class="p-3">Status</th>
                <th class="p-3 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="orders-table-body" class="divide-y"></tbody>
          </table>
        </div>
      </section>

      <!-- Products & Price Sheet Tab -->
      <section id="sec-products" class="space-y-4 hidden">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="text-base font-bold text-gray-900">Products & Pricing</h2>
            <p class="text-[11px] text-gray-500">Edit rates or add new inventory.</p>
          </div>
          <button onclick="openAddModal()" class="bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">+ Add Item</button>
        </div>

        <div class="bg-white rounded-xl border overflow-x-auto shadow-sm">
          <table class="w-full text-left text-xs whitespace-nowrap">
            <thead class="bg-gray-50 border-b text-gray-500 font-bold uppercase text-[10px]">
              <tr>
                <th class="p-3">Photo</th>
                <th class="p-3">Name</th>
                <th class="p-3">Category</th>
                <th class="p-3">MRP (₹)</th>
                <th class="p-3">Offer (₹)</th>
                <th class="p-3 text-right">Save</th>
              </tr>
            </thead>
            <tbody id="products-table-body" class="divide-y"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- Add Item Modal -->
  <div id="add-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-5 w-full max-w-xs overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-sm font-bold">Add Cracker</h3>
        <button onclick="closeAddModal()" class="text-gray-400 font-bold text-xl">&times;</button>
      </div>
      <form onsubmit="handleSaveProduct(event)" class="space-y-3 text-xs">
        <div>
          <label class="font-semibold block mb-0.5">Product Name *</label>
          <input required id="p-name" type="text" class="w-full border rounded p-2" placeholder="e.g. 10-Sky Rainbow" />
        </div>
        <div>
          <label class="font-semibold block mb-0.5">Category *</label>
          <select id="p-category" class="w-full border rounded p-2">
            <option value="Sparklers">Sparklers</option>
            <option value="Sound Crackers">Sound Crackers</option>
            <option value="Ground Chakkars">Ground Chakkars</option>
            <option value="Flower Pots">Flower Pots</option>
            <option value="Sky Shots">Sky Shots</option>
            <option value="Gift Boxes">Gift Boxes</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="font-semibold block mb-0.5">MRP (₹) *</label>
            <input required id="p-mrp" type="number" class="w-full border rounded p-2" />
          </div>
          <div>
            <label class="font-semibold block mb-0.5">Offer (₹) *</label>
            <input required id="p-price" type="number" class="w-full border rounded p-2" />
          </div>
        </div>
        <div>
          <label class="font-semibold block mb-0.5">Photo</label>
          <input id="p-image-file" type="file" accept="image/*" class="w-full text-[11px] text-gray-500" />
        </div>
        <button type="submit" id="save-btn" class="w-full bg-red-600 text-white font-bold py-2 rounded-lg mt-2">Upload & Save</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://lqfrjlznszxexqmliupd.supabase.co";
    const SUPABASE_KEY = "Sb_publishable_npJ_6_c3o1RRCRgaLVLpxg_RizK86NU";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let productsCache = [];

    function checkPin() {
      if (document.getElementById('admin-pin').value === '1234') {
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('admin-app').classList.remove('hidden');
        loadOrders();
        loadProducts();
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    }

    function switchTab(tab) {
      document.getElementById('sec-orders').classList.toggle('hidden', tab !== 'orders');
      document.getElementById('sec-products').classList.toggle('hidden', tab !== 'products');
      document.getElementById('tab-orders').className = tab === 'orders' ? 'px-3 py-1.5 rounded-lg bg-red-600 text-white' : 'px-3 py-1.5 rounded-lg text-gray-600';
      document.getElementById('tab-products').className = tab === 'products' ? 'px-3 py-1.5 rounded-lg bg-red-600 text-white' : 'px-3 py-1.5 rounded-lg text-gray-600';
    }

    async function loadOrders() {
      const { data } = await db.from('orders').select('*').order('created_at', { ascending: false });
      const tbody = document.getElementById('orders-table-body');
      tbody.innerHTML = (data || []).map(o => `
        <tr>
          <td class="p-3 font-mono font-bold text-gray-700">#${o.id}</td>
          <td class="p-3 font-semibold text-gray-900">${o.customer_name}<br><span class="text-gray-400 font-normal text-[11px]">${o.customer_phone}</span></td>
          <td class="p-3 font-bold text-gray-900">₹${o.total_amount}</td>
          <td class="p-3">
            <select onchange="updateOrderStatus('${o.id}', this.value)" class="text-xs border rounded px-1.5 py-0.5">
              <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
              <option value="Confirmed" ${o.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
              <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
            </select>
          </td>
          <td class="p-3 text-right">
            <a href="https://wa.me/91${o.customer_phone}" target="_blank" class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-1 rounded text-xs font-semibold">WhatsApp</a>
          </td>
        </tr>
      `).join('');
    }

    async function updateOrderStatus(id, status) {
      await db.from('orders').update({ status }).eq('id', id);
    }

    async function loadProducts() {
      const { data } = await db.from('products').select('*').order('name');
      productsCache = data || [];
      const tbody = document.getElementById('products-table-body');
      tbody.innerHTML = productsCache.map(p => `
        <tr>
          <td class="p-3">
            <img src="${p.image_url || 'https://placehold.co/40x40?text=Cracker'}" class="w-8 h-8 object-cover rounded border" />
          </td>
          <td class="p-3 font-semibold text-gray-900">${p.name}</td>
          <td class="p-3 text-gray-500">${p.category}</td>
          <td class="p-3">
            <input type="number" value="${p.mrp}" id="mrp-${p.id}" class="w-16 border rounded px-1.5 py-0.5 text-xs text-gray-500" />
          </td>
          <td class="p-3">
            <input type="number" value="${p.offer_price}" id="price-${p.id}" class="w-16 border border-red-300 rounded px-1.5 py-0.5 text-xs font-bold text-red-600" />
          </td>
          <td class="p-3 text-right">
            <button onclick="saveInlinePrice('${p.id}')" class="bg-gray-100 hover:bg-gray-200 px-2.5 py-1 rounded text-xs font-semibold">Save</button>
          </td>
        </tr>
      `).join('');
    }

    async function saveInlinePrice(id) {
      const mrp = Number(document.getElementById(`mrp-${id}`).value);
      const offer_price = Number(document.getElementById(`price-${id}`).value);
      await db.from('products').update({ mrp, offer_price }).eq('id', id);
      alert('Price updated live on storefront!');
    }

    function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
    function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }

    async function handleSaveProduct(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('save-btn');
      saveBtn.innerText = 'Uploading...';
      saveBtn.disabled = true;

      let imageUrl = null;
      const fileInput = document.getElementById('p-image-file');

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const filePath = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
        const { error: uploadErr } = await db.storage.from('products').upload(filePath, file);

        if (!uploadErr) {
          const { data: publicUrlData } = db.storage.from('products').getPublicUrl(filePath);
          imageUrl = publicUrlData.publicUrl;
        }
      }

      await db.from('products').insert([{
        name: document.getElementById('p-name').value,
        category: document.getElementById('p-category').value,
        mrp: Number(document.getElementById('p-mrp').value),
        offer_price: Number(document.getElementById('p-price').value),
        image_url: imageUrl
      }]);

      closeAddModal();
      saveBtn.innerText = 'Upload & Save';
      saveBtn.disabled = false;
      loadProducts();
    }
  </script>
</body>
</html>
